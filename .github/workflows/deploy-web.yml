name: Build and deploy iPhone web version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.3

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Prepare Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
          elif [ -d "/root/.local/share/godot/templates/${GODOT_VERSION}.stable" ]; then
            cp -a "/root/.local/share/godot/templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
          else
            echo "Godot ${GODOT_VERSION} export templates were not found in the CI image."
            find /root/.local/share/godot -maxdepth 3 -type d || true
            exit 1
          fi
      - name: Import project and validate scripts
        run: godot --headless --editor --path . --quit
      - name: Export Web build
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Web" build/index.html
      - name: Upload web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
